[project]
name = "datalens-backend"
version = "0.1.0"
description = "AI-Powered Data Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.5.0",
    "anthropic>=0.39.0",
    "google-genai>=1.0.0",
    "ddgs>=9.0.0",
    "duckduckgo-search>=6.0.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "rapidfuzz>=3.10.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "dateparser>=1.2.0",
    "sse-starlette>=2.1.0",
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
